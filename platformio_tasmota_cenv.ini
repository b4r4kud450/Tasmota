; platformio_tasmota_cenv.ini - Freenove ESP32-S3 N16R8 + OV3660
; 
; ВАЖЛИВІ ЗМІНИ порівняно з попередньою версією:
; 1. ВИКОРИСТОВУЄМО USE_WEBCAM (V1), НЕ USE_WEBCAM_V2!
;    V2 має окремий task і додаткові проблеми з OV3660.
; 2. НЕ включаємо ENABLE_RTSPSERVER — він залежить від V2.
; 3. board = freenove_esp32s3_n16r8 для правильної карти пам'яті.
;
; Якщо зборка не проходить через lib_ignore — видаліть рядок з OV2640.

[env:tasmota32s3-webcam-ov3660]
extends = env:tasmota32s3
board = freenove_esp32s3_n16r8
build_flags = ${env:tasmota32s3.build_flags}
    -DFIRMWARE_WEBCAM
    -DUSE_WEBCAM
    ; -DUSE_WEBCAM_V2   ; <-- НЕ ВКЛЮЧАТИ! V2 несумісний з OV3660
    ; -DENABLE_RTSPSERVER  ; <-- НЕ ВКЛЮЧАТИ! Потребує V2
    -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32s3-webcam.bin"'
lib_extra_dirs = ${env:tasmota32s3.lib_extra_dirs}
    lib/lib_ssl
lib_ignore = ${env:tasmota32s3.lib_ignore}
