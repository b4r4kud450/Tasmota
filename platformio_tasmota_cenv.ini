; platformio_tasmota_cenv.ini - Freenove ESP32-S3 N16R8 + OV3660
; 
; ВАЖЛИВО: НЕ використовувати -DFIRMWARE_WEBCAM!
; Воно автоматично визначає USE_WEBCAM_V2 і ENABLE_RTSPSERVER,
; які потребують OV2640.h і НЕ працюють з OV3660.
;
; Замість цього визначаємо тільки необхідне вручну.

[env:tasmota32s3-webcam-ov3660]
extends = env:tasmota32s3
board = freenove_esp32s3_n16r8

; ============================================
; PARTITION TABLE — для 16MB flash
; ============================================
board_build.partitions = partitions_16mb.csv

; ============================================
; Build flags — ТІЛЬКИ необхідне, без V2/RTSP!
; ============================================
build_flags = ${env:tasmota32s3.build_flags}
    ; -DFIRMWARE_WEBCAM  ; <-- НЕ ВИКОРИСТОВУВАТИ! Автоматично включає V2+RTSP
    -DUSE_WEBCAM          ; V1 драйвер (generic, працює з будь-яким сенсором)
    -DUSE_ESP32_CAM       ; Підтримка ESP32-CAM
    -DCODE_IMAGE_STR="\"webcam-ov3660\""
    -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32s3-webcam.bin"'

; ============================================
; Libraries
; ============================================
lib_extra_dirs = ${env:tasmota32s3.lib_extra_dirs}
    lib/lib_ssl
lib_ignore = ${env:tasmota32s3.lib_ignore}
