; platformio_tasmota_cenv.ini - Freenove ESP32-S3 + OV3660

[env:tasmota32s3-webcam-ov3660]
extends = env:tasmota32s3
board = esp32s3-qio_qspi
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = partitions/esp32_partition_app1856k_fs13440k.csv
build_flags = ${env:tasmota32s3.build_flags}
    -DFIRMWARE_WEBCAM
    -DUSE_WEBCAM
    -DUSE_ESP32_CAM
    -DOTA_URL='"http://ota.tasmota.com/tasmota32/release/tasmota32s3-webcam.bin"'
lib_extra_dirs = lib/lib_ssl, lib/libesp32
