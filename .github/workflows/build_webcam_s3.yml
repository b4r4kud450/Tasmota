name: Build ESP32-S3 WebCam OV3660

on:
  workflow_dispatch:

jobs:
  build-s3-webcam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install pioarduino
      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: pio run -e tasmota32s3-webcam-ov3660
      - name: Copy firmware
        run: |
          mkdir -p build_output
          # Для ESP32-S3 PlatformIO створює merged firmware тут:
          cp .pio/build/tasmota32s3-webcam-ov3660/tasmota32s3-webcam-ov3660.bin build_output/ ||           cp .pio/build/tasmota32s3-webcam-ov3660/firmware.bin build_output/tasmota32s3-webcam-ov3660.bin
      - name: List build files
        run: |
          echo "=== Files in build dir ==="
          ls -la .pio/build/tasmota32s3-webcam-ov3660/
          echo "=== Files in build_output ==="
          ls -la build_output/
      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32s3-webcam-ov3660
          path: build_output/*.bin
