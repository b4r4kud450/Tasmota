name: Build ESP32-S3 WebCam OV3660

on:
  workflow_dispatch:

jobs:
  build-s3-webcam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PlatformIO
        run: pip install pioarduino
      - name: Build
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: pio run -e tasmota32s3-webcam-ov3660
      - name: Find and copy firmware
        run: |
          mkdir -p build_output
          BUILD_DIR=".pio/build/tasmota32s3-webcam-ov3660"

          echo "=== Files in build directory ==="
          ls -la $BUILD_DIR/

          # Копіюємо firmware-factory.bin (повна прошивка з partition table)
          if [ -f "$BUILD_DIR/firmware-factory.bin" ]; then
            cp "$BUILD_DIR/firmware-factory.bin" build_output/tasmota32s3-webcam-ov3660.bin
            echo "✅ Copied firmware-factory.bin (FULL firmware)"
          else
            echo "❌ ERROR: firmware-factory.bin not found!"
            exit 1
          fi

          echo "=== Output file ==="
          ls -la build_output/
      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32s3-webcam-ov3660
          path: build_output/*.bin
