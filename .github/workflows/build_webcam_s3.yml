name: Build ESP32-S3 WebCam OV3660

on:
  workflow_dispatch:

jobs:
  build-s3-webcam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PlatformIO (pioarduino)
        run: pip install pioarduino

      - name: Patch camera_pins.h for OV3660
        run: |
          python3 tools/patch_camera_pins.py lib/default/headers/camera_pins.h

      - name: Build tasmota32s3-webcam-ov3660
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: '1'
        run: platformio run -e tasmota32s3-webcam-ov3660

      - uses: actions/upload-artifact@v4
        with:
          name: tasmota32s3-webcam-ov3660
          path: ./build_output/firmware/tasmota32s3-webcam-ov3660.bin
